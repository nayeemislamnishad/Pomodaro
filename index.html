<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow | Simple Timer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #8a2be2;
            --primary-dark: #6a1cb0;
            --secondary: #ff6b9d;
            --accent: #00d4ff;
            --dark: #0f0b1f;
            --darker: #080611;
            --light: #f8f9ff;
            --gray: #3a3a5d;
            --success: #2ecc71;
            --warning: #f39c12;
            --danger: #e74c3c;
            --transition: all 0.3s ease;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            --inner-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark);
            color: var(--light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: var(--transition);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }

        /* Header */
        header {
            padding: 25px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background-color: rgba(15, 11, 31, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.8rem;
            color: var(--accent);
        }

        .logo i {
            color: var(--primary);
        }

        .nav-controls {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.4);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Main Content */
        main {
            flex: 1;
            padding: 40px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Timer Section */
        .timer-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .timer-container {
            background: linear-gradient(145deg, #15102b, #0d091c);
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .timer-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.1) 0%, transparent 70%);
            z-index: 0;
        }

        .timer-header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .timer-title {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--accent);
        }

        .timer-subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1.1rem;
        }

        /* Big Clock */
        .clock-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px 0;
            position: relative;
            z-index: 1;
        }

        .big-clock {
            font-family: 'Orbitron', sans-serif;
            font-size: 7.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 5px 15px rgba(0, 212, 255, 0.2);
            letter-spacing: 5px;
            line-height: 1;
            padding: 30px;
            padding-left:10px;
            border-radius: 25px;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            min-width: 715px;
            text-align: center;
        }

        @media (max-width: 768px) {
            .big-clock {
                font-size: 6rem;
                letter-spacing: 3px;
                min-width: 500px;
                padding: 20px;
                padding-left:10px;
            }
        }

        @media (max-width: 576px) {
            .big-clock {
                font-size: 4.5rem;
                min-width: 500px;
                padding: 15px;
                padding-left:10px;
            }
        }

        /* Timer Controls */
        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .timer-btn {
            padding: 16px 32px;
            font-size: 1.2rem;
            min-width: 160px;
        }

        .timer-btn i {
            font-size: 1.3rem;
        }

        /* Timer Status */
        .timer-status {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 30px;
            padding: 15px 30px;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            z-index: 1;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--gray);
            transition: var(--transition);
        }

        .status-indicator.running {
            background-color: var(--success);
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.5);
            animation: pulse 2s infinite;
        }

        .status-indicator.paused {
            background-color: var(--warning);
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .status-text {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.8);
        }

        /* Lap Times */
        .lap-times {
            margin-top: 40px;
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 600px;
        }

        .lap-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .lap-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--accent);
        }

        .lap-count {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.6);
            background-color: rgba(0, 0, 0, 0.3);
            padding: 5px 15px;
            border-radius: 20px;
        }

        .lap-list {
            max-height: 300px;
            overflow-y: auto;
            padding-right: 10px;
        }

        .lap-list::-webkit-scrollbar {
            width: 6px;
        }

        .lap-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .lap-list::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .lap-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 8px;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: var(--transition);
        }

        .lap-item:hover {
            background-color: rgba(0, 0, 0, 0.3);
            transform: translateX(5px);
        }

        .lap-number {
            font-family: 'Orbitron', sans-serif;
            font-weight: 600;
            color: var(--accent);
            min-width: 40px;
        }

        .lap-time {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.3rem;
            color: white;
        }

        .lap-item:nth-child(odd) {
            background-color: rgba(0, 0, 0, 0.25);
        }

        .lap-item:first-child {
            background-color: rgba(138, 43, 226, 0.2);
            border-color: rgba(138, 43, 226, 0.3);
        }

        .lap-item:first-child .lap-time {
            color: var(--primary);
            font-weight: 700;
        }

        /* Notification */
        .notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 18px 25px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            transform: translateX(150%);
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification i {
            font-size: 1.3rem;
        }

        /* Footer */
        footer {
            padding: 25px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background-color: rgba(8, 6, 17, 0.9);
            text-align: center;
            margin-top: 40px;
        }

        .footer-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        /* Lights Off Mode */
        body.lights-off {
            background-color: var(--darker);
        }

        body.lights-off .timer-container {
            background: linear-gradient(145deg, #0d091c, #060411);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        body.lights-off .big-clock {
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 20px;
            }
            
            .timer-btn {
                min-width: 140px;
                padding: 14px 20px;
                font-size: 1.1rem;
            }
            
            .timer-controls {
                gap: 10px;
            }
            
            .big-clock {
                font-size: 5rem;
                min-width: 350px;
            }
        }

        @media (max-width: 576px) {
            .big-clock {
                font-size: 4rem;
                min-width: 280px;
                padding: 15px;
            }
            
            .timer-controls {
                flex-direction: column;
                align-items: center;
            }
            
            .timer-btn {
                width: 100%;
                max-width: 250px;
            }
            
            .lap-times {
                margin-top: 30px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container header-content">
            <div class="logo">
                <i class="fas fa-hourglass-half"></i>
                <span>FocusFlow</span>
            </div>
            <div class="nav-controls">
                <button class="btn btn-secondary" id="lightsOffBtn">
                    <i class="fas fa-lightbulb"></i> Lights Off
                </button>
                <button class="btn btn-primary" id="fullscreenBtn">
                    <i class="fas fa-expand"></i> Fullscreen
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="container timer-section">
            <div class="timer-container">
                <div class="timer-header">
                    <h1 class="timer-title">Simple Forward Timer</h1>
                    <p class="timer-subtitle">Counts up from zero. Record laps to track intervals.</p>
                </div>
                
                <!-- Big Clock -->
                <div class="clock-container">
                    <div class="big-clock" id="clock">00:00:00</div>
                </div>
                
                <!-- Timer Status -->
                <div class="timer-status">
                    <div class="status-indicator" id="statusIndicator"></div>
                    <div class="status-text" id="statusText">Ready to start</div>
                </div>
                
                <!-- Timer Controls -->
                <div class="timer-controls">
                    <button class="btn btn-primary timer-btn" id="startBtn">
                        <i class="fas fa-play"></i> Start
                    </button>
                    <button class="btn btn-secondary timer-btn" id="pauseBtn">
                        <i class="fas fa-pause"></i> Pause
                    </button>
                    <button class="btn btn-secondary timer-btn" id="resetBtn">
                        <i class="fas fa-redo"></i> Reset
                    </button>
                    <button class="btn btn-secondary timer-btn" id="lapBtn">
                        <i class="fas fa-flag"></i> Lap
                    </button>
                </div>
                
                <!-- Lap Times -->
                <div class="lap-times">
                    <div class="lap-header">
                        <div class="lap-title">Lap Times</div>
                        <div class="lap-count" id="lapCount">0 laps</div>
                    </div>
                    <div class="lap-list" id="lapList">
                        <!-- Lap times will appear here -->
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Footer -->
    <footer>
        <div class="container">
            <p class="footer-text">FocusFlow Simple Timer &copy; 2023 | Count-up Timer | Works in Background</p>
        </div>
    </footer>
    
    <!-- Notification -->
    <div class="notification" id="notification">
        <i class="fas fa-bell"></i>
        <span id="notificationText">Timer started!</span>
    </div>

    <script>
        // DOM Elements
        const clockElement = document.getElementById('clock');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const lapBtn = document.getElementById('lapBtn');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');
        const lapList = document.getElementById('lapList');
        const lapCount = document.getElementById('lapCount');
        const lightsOffBtn = document.getElementById('lightsOffBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const notification = document.getElementById('notification');
        const notificationText = document.getElementById('notificationText');

        // Timer Variables
        let timerInterval;
        let isRunning = false;
        let elapsedTime = 0; // In seconds
        let lapTimes = [];
        let lapCounter = 0;

        // Initialize the app
        function init() {
            updateClockDisplay();
            updateLapList();
            setupEventListeners();
            updateStatus();
        }

        // Set up event listeners
        function setupEventListeners() {
            startBtn.addEventListener('click', startTimer);
            pauseBtn.addEventListener('click', pauseTimer);
            resetBtn.addEventListener('click', resetTimer);
            lapBtn.addEventListener('click', recordLap);
            
            lightsOffBtn.addEventListener('click', toggleLightsOff);
            fullscreenBtn.addEventListener('click', toggleFullscreen);
            
            // Keep timer running in background
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && isRunning) {
                    console.log('Tab hidden, timer continues in background');
                }
            });
        }

        // Timer Functions (Forward Timer / Count-up Timer)
        function startTimer() {
            if (isRunning) return;
            
            isRunning = true;
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            lapBtn.disabled = false;
            
            const startTime = Date.now() - (elapsedTime * 1000);
            
            timerInterval = setInterval(() => {
                elapsedTime = Math.floor((Date.now() - startTime) / 1000);
                updateClockDisplay();
            }, 1000);
            
            updateStatus();
            showNotification('Timer started!');
        }

        function pauseTimer() {
            if (!isRunning) return;
            
            isRunning = false;
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            lapBtn.disabled = true;
            
            clearInterval(timerInterval);
            
            updateStatus();
            showNotification('Timer paused');
        }

        function resetTimer() {
            isRunning = false;
            elapsedTime = 0;
            
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            lapBtn.disabled = true;
            
            clearInterval(timerInterval);
            updateClockDisplay();
            updateStatus();
            
            showNotification('Timer reset');
        }

        function updateClockDisplay() {
            const hours = Math.floor(elapsedTime / 3600);
            const minutes = Math.floor((elapsedTime % 3600) / 60);
            const seconds = elapsedTime % 60;
            
            // Format with leading zeros
            const hoursStr = hours.toString().padStart(2, '0');
            const minutesStr = minutes.toString().padStart(2, '0');
            const secondsStr = seconds.toString().padStart(2, '0');
            
            // Display time
            clockElement.textContent = `${hoursStr}:${minutesStr}:${secondsStr}`;
            
            // Update document title
            document.title = `${hoursStr}:${minutesStr}:${secondsStr} - FocusFlow Timer`;
            
            // Change clock color based on time
            if (hours > 0) {
                clockElement.style.background = 'linear-gradient(135deg, var(--primary), var(--secondary))';
            } else if (minutes > 30) {
                clockElement.style.background = 'linear-gradient(135deg, var(--accent), var(--primary))';
            } else {
                clockElement.style.background = 'linear-gradient(135deg, var(--primary), var(--accent))';
            }
            clockElement.style.webkitBackgroundClip = 'text';
        }

        function updateStatus() {
            if (isRunning) {
                statusIndicator.className = 'status-indicator running';
                statusText.textContent = 'Timer is running';
            } else if (elapsedTime > 0) {
                statusIndicator.className = 'status-indicator paused';
                statusText.textContent = 'Timer is paused';
            } else {
                statusIndicator.className = 'status-indicator';
                statusText.textContent = 'Ready to start';
            }
        }

        // Lap Functions
        function recordLap() {
            if (!isRunning) return;
            
            lapCounter++;
            const lapTime = elapsedTime;
            
            // Format lap time
            const hours = Math.floor(lapTime / 3600);
            const minutes = Math.floor((lapTime % 3600) / 60);
            const seconds = lapTime % 60;
            
            let lapTimeStr = '';
            if (hours > 0) {
                lapTimeStr = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            } else {
                lapTimeStr = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }
            
            // Calculate lap difference if there are previous laps
            let lapDifference = 0;
            if (lapTimes.length > 0) {
                const previousLap = lapTimes[0].time;
                lapDifference = lapTime - previousLap;
            }
            
            // Add to lap times array
            lapTimes.unshift({
                number: lapCounter,
                time: lapTime,
                formatted: lapTimeStr,
                difference: lapDifference
            });
            
            // Update lap list display
            updateLapList();
            
            showNotification(`Lap ${lapCounter} recorded: ${lapTimeStr}`);
        }

        function updateLapList() {
            // Update lap count
            lapCount.textContent = `${lapTimes.length} ${lapTimes.length === 1 ? 'lap' : 'laps'}`;
            
            // Clear current list
            lapList.innerHTML = '';
            
            // Add lap items
            lapTimes.forEach((lap, index) => {
                const lapItem = document.createElement('div');
                lapItem.className = 'lap-item';
                
                // Format lap number with leading zeros
                const lapNumber = lap.number.toString().padStart(2, '0');
                
                // Create difference indicator if not the first lap
                let differenceHtml = '';
                if (index > 0 && lap.difference !== 0) {
                    const diffSign = lap.difference > 0 ? '+' : '';
                    const diffClass = lap.difference > 0 ? 'style="color: var(--danger); font-size: 0.9rem;"' : 'style="color: var(--success); font-size: 0.9rem;"';
                    differenceHtml = `<div ${diffClass}>${diffSign}${formatTime(lap.difference)}</div>`;
                }
                
                lapItem.innerHTML = `
                    <div class="lap-number">#${lapNumber}</div>
                    <div class="lap-time">${lap.formatted}</div>
                    ${differenceHtml}
                `;
                
                lapList.appendChild(lapItem);
            });
            
            // If no laps, show message
            if (lapTimes.length === 0) {
                const emptyMessage = document.createElement('div');
                emptyMessage.className = 'lap-item';
                emptyMessage.style.textAlign = 'center';
                emptyMessage.style.color = 'rgba(255, 255, 255, 0.5)';
                emptyMessage.style.padding = '30px 15px';
                emptyMessage.innerHTML = `
                    <div>
                        <i class="fas fa-flag" style="font-size: 2rem; margin-bottom: 10px; opacity: 0.3;"></i>
                        <div>No lap times recorded yet</div>
                        <div style="font-size: 0.9rem; margin-top: 5px;">Click "Lap" button to record intervals</div>
                    </div>
                `;
                lapList.appendChild(emptyMessage);
            }
        }

        function formatTime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = seconds % 60;
            
            if (hours > 0) {
                return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            } else {
                return `${minutes.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }
        }

        function clearLaps() {
            lapTimes = [];
            lapCounter = 0;
            updateLapList();
            showNotification('Lap times cleared');
        }

        // UI Functions
        function toggleLightsOff() {
            document.body.classList.toggle('lights-off');
            const icon = lightsOffBtn.querySelector('i');
            
            if (document.body.classList.contains('lights-off')) {
                icon.className = 'fas fa-moon';
                lightsOffBtn.innerHTML = '<i class="fas fa-moon"></i> Lights On';
                showNotification('Lights off mode activated');
            } else {
                icon.className = 'fas fa-lightbulb';
                lightsOffBtn.innerHTML = '<i class="fas fa-lightbulb"></i> Lights Off';
                showNotification('Lights on mode activated');
            }
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
                fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i> Exit Fullscreen';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i> Fullscreen';
                }
            }
        }

        function showNotification(message) {
            notificationText.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            // Spacebar to start/pause
            if (e.code === 'Space') {
                e.preventDefault();
                if (isRunning) {
                    pauseTimer();
                } else {
                    startTimer();
                }
            }
            
            // 'L' key for lap
            if (e.code === 'KeyL' && isRunning) {
                recordLap();
            }
            
            // 'R' key for reset
            if (e.code === 'KeyR') {
                resetTimer();
            }
        });

        // Add context menu for clearing laps
        lapList.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if (lapTimes.length > 0) {
                if (confirm('Clear all lap times?')) {
                    clearLaps();
                }
            }
        });

        // Initialize the app
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
