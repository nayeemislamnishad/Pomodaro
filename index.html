<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow | Pomodoro Timer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Orbitron:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #8a2be2;
            --primary-dark: #6a1cb0;
            --secondary: #ff6b9d;
            --accent: #00d4ff;
            --dark: #0f0b1f;
            --darker: #080611;
            --light: #f8f9ff;
            --gray: #3a3a5d;
            --success: #2ecc71;
            --warning: #f39c12;
            --danger: #e74c3c;
            --transition: all 0.3s ease;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            --inner-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--dark);
            color: var(--light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            transition: var(--transition);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            width: 100%;
        }

        /* Header */
        header {
            padding: 25px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            background-color: rgba(15, 11, 31, 0.9);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 1.8rem;
            color: var(--accent);
        }

        .logo i {
            color: var(--primary);
        }

        .nav-controls {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 50px;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.4);
        }

        .btn-secondary {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Main Content */
        main {
            flex: 1;
            padding: 40px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            width: 100%;
            margin-top: 20px;
        }

        @media (max-width: 992px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        /* Timer Section */
        .timer-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .timer-container {
            background: linear-gradient(145deg, #15102b, #0d091c);
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            max-width: 600px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .timer-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.1) 0%, transparent 70%);
            z-index: 0;
        }

        .timer-header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .timer-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--accent);
        }

        .timer-subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
        }

        /* Big Clock */
        .clock-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 30px 0;
            position: relative;
            z-index: 1;
        }

        .big-clock {
            font-family: 'Orbitron', sans-serif;
            font-size: 6.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 5px 15px rgba(0, 212, 255, 0.2);
            letter-spacing: 5px;
            line-height: 1;
            padding: 20px;
            border-radius: 20px;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 768px) {
            .big-clock {
                font-size: 4.5rem;
                letter-spacing: 3px;
            }
        }

        /* Timer Controls */
        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .timer-btn {
            padding: 15px 30px;
            font-size: 1.1rem;
            min-width: 140px;
        }

        .timer-btn i {
            font-size: 1.2rem;
        }

        /* Time Settings */
        .time-settings {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        .time-input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-input-label {
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.7);
        }

        .time-input {
            width: 100px;
            padding: 12px 15px;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            text-align: center;
            transition: var(--transition);
        }

        .time-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(138, 43, 226, 0.3);
        }

        /* Pomodoro Sessions */
        .pomodoro-sessions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 30px;
            position: relative;
            z-index: 1;
        }

        .session-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: var(--gray);
            transition: var(--transition);
        }

        .session-dot.active {
            background-color: var(--success);
            transform: scale(1.2);
        }

        .session-dot.completed {
            background-color: var(--primary);
        }

        /* Audio Section */
        .audio-section {
            display: flex;
            flex-direction: column;
        }

        .audio-container {
            background: linear-gradient(145deg, #15102b, #0d091c);
            border-radius: 30px;
            padding: 40px;
            width: 100%;
            height: 100%;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        .audio-container::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 107, 157, 0.1) 0%, transparent 70%);
            z-index: 0;
        }

        .audio-header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 1;
        }

        .audio-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--secondary);
        }

        .audio-subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 1rem;
        }

        /* YouTube Input */
        .youtube-input-container {
            position: relative;
            z-index: 1;
            margin-bottom: 30px;
        }

        .youtube-input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .youtube-label {
            font-size: 1.1rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .youtube-label i {
            color: var(--danger);
        }

        .youtube-input {
            width: 100%;
            padding: 18px 20px;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem;
            transition: var(--transition);
        }

        .youtube-input:focus {
            outline: none;
            border-color: var(--secondary);
            box-shadow: 0 0 0 2px rgba(255, 107, 157, 0.3);
        }

        .youtube-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .audio-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            position: relative;
            z-index: 1;
        }

        .volume-control {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
        }

        .volume-slider {
            width: 100%;
            max-width: 200px;
            -webkit-appearance: none;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.1);
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--secondary);
            cursor: pointer;
        }

        /* Preset Audio */
        .preset-audio {
            margin-top: 30px;
            position: relative;
            z-index: 1;
        }

        .preset-title {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 15px;
            color: var(--accent);
        }

        .preset-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .preset-btn {
            padding: 10px 20px;
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: white;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
        }

        .preset-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .preset-btn.active {
            background-color: var(--primary);
            border-color: var(--primary);
        }

        /* Notification */
        .notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 18px 25px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            transform: translateX(150%);
            transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55);
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification i {
            font-size: 1.3rem;
        }

        /* Footer */
        footer {
            padding: 25px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background-color: rgba(8, 6, 17, 0.9);
            text-align: center;
            margin-top: 40px;
        }

        .footer-text {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        /* Lights Off Mode */
        body.lights-off {
            background-color: var(--darker);
        }

        body.lights-off .timer-container,
        body.lights-off .audio-container {
            background: linear-gradient(145deg, #0d091c, #060411);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        body.lights-off .big-clock {
            text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
        }

        /* Responsive */
        @media (max-width: 576px) {
            .header-content {
                flex-direction: column;
                gap: 20px;
            }
            
            .timer-btn {
                min-width: 120px;
                padding: 12px 20px;
            }
            
            .big-clock {
                font-size: 3.5rem;
            }
            
            .time-input {
                width: 80px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container header-content">
            <div class="logo">
                <i class="fas fa-hourglass-half"></i>
                <span>FocusFlow</span>
            </div>
            <div class="nav-controls">
                <button class="btn btn-secondary" id="lightsOffBtn">
                    <i class="fas fa-lightbulb"></i> Lights Off
                </button>
                <button class="btn btn-primary" id="fullscreenBtn">
                    <i class="fas fa-expand"></i> Fullscreen
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <div class="container main-content">
            <!-- Timer Section -->
            <div class="timer-section">
                <div class="timer-container">
                    <div class="timer-header">
                        <h1 class="timer-title">Pomodoro Timer</h1>
                        <p class="timer-subtitle">Focus for 25 minutes, break for 5 minutes</p>
                    </div>
                    
                    <!-- Big Clock -->
                    <div class="clock-container">
                        <div class="big-clock" id="clock">25:00</div>
                    </div>
                    
                    <!-- Timer Controls -->
                    <div class="timer-controls">
                        <button class="btn btn-primary timer-btn" id="startBtn">
                            <i class="fas fa-play"></i> Start
                        </button>
                        <button class="btn btn-secondary timer-btn" id="pauseBtn">
                            <i class="fas fa-pause"></i> Pause
                        </button>
                        <button class="btn btn-secondary timer-btn" id="resetBtn">
                            <i class="fas fa-redo"></i> Reset
                        </button>
                    </div>
                    
                    <!-- Time Settings -->
                    <div class="time-settings">
                        <div class="time-input-group">
                            <label class="time-input-label">Focus (minutes)</label>
                            <input type="number" class="time-input" id="focusTime" value="25" min="1" max="60">
                        </div>
                        <div class="time-input-group">
                            <label class="time-input-label">Break (minutes)</label>
                            <input type="number" class="time-input" id="breakTime" value="5" min="1" max="30">
                        </div>
                        <div class="time-input-group">
                            <label class="time-input-label">Sessions</label>
                            <input type="number" class="time-input" id="sessionCount" value="4" min="1" max="10">
                        </div>
                    </div>
                    
                    <!-- Pomodoro Sessions -->
                    <div class="pomodoro-sessions" id="sessionDots">
                        <!-- Session dots will be generated here -->
                    </div>
                </div>
            </div>
            
            <!-- Audio Section -->
            <div class="audio-section">
                <div class="audio-container">
                    <div class="audio-header">
                        <h1 class="audio-title">Background Audio</h1>
                        <p class="audio-subtitle">Paste a YouTube link for focus music</p>
                    </div>
                    
                    <!-- YouTube Input -->
                    <div class="youtube-input-container">
                        <div class="youtube-input-group">
                            <label class="youtube-label">
                                <i class="fab fa-youtube"></i> YouTube Video URL
                            </label>
                            <input type="text" class="youtube-input" id="youtubeUrl" placeholder="Paste YouTube link here (e.g., https://www.youtube.com/watch?v=...)">
                        </div>
                        
                        <div class="audio-controls">
                            <button class="btn btn-primary" id="loadAudioBtn">
                                <i class="fas fa-music"></i> Load Audio
                            </button>
                            
                            <div class="volume-control">
                                <i class="fas fa-volume-up"></i>
                                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="50">
                            </div>
                        </div>
                    </div>
                    
                    <!-- Preset Audio -->
                    <div class="preset-audio">
                        <h3 class="preset-title">Or choose a preset:</h3>
                        <div class="preset-buttons">
                            <button class="preset-btn" data-url="https://www.youtube.com/watch?v=jfKfPfyJRdk">Lofi Girl</button>
                            <button class="preset-btn" data-url="https://www.youtube.com/watch?v=5qap5aO4i9A">Lofi Hip Hop</button>
                            <button class="preset-btn" data-url="https://www.youtube.com/watch?v=DWcJFNfaw9c">Classical Study</button>
                            <button class="preset-btn" data-url="https://www.youtube.com/watch?v=bLlv8Vx4J3I">Nature Sounds</button>
                            <button class="preset-btn" data-url="https://www.youtube.com/watch?v=4oStw0uZ3GI">Cafe Ambience</button>
                            <button class="preset-btn" data-url="https://www.youtube.com/watch?v=wO8O5eKZtsA">Piano Focus</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <!-- Footer -->
    <footer>
        <div class="container">
            <p class="footer-text">FocusFlow Pomodoro Timer &copy; 2023 | Timer works in background | Audio continues playing</p>
        </div>
    </footer>
    
    <!-- Notification -->
    <div class="notification" id="notification">
        <i class="fas fa-bell"></i>
        <span id="notificationText">Timer completed!</span>
    </div>

    <script>
        // DOM Elements
        const clockElement = document.getElementById('clock');
        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const resetBtn = document.getElementById('resetBtn');
        const focusTimeInput = document.getElementById('focusTime');
        const breakTimeInput = document.getElementById('breakTime');
        const sessionCountInput = document.getElementById('sessionCount');
        const sessionDotsContainer = document.getElementById('sessionDots');
        const youtubeUrlInput = document.getElementById('youtubeUrl');
        const loadAudioBtn = document.getElementById('loadAudioBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const presetButtons = document.querySelectorAll('.preset-btn');
        const lightsOffBtn = document.getElementById('lightsOffBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const notification = document.getElementById('notification');
        const notificationText = document.getElementById('notificationText');

        // Timer Variables
        let timerInterval;
        let isRunning = false;
        let isFocusTime = true;
        let timeLeft = 25 * 60; // 25 minutes in seconds
        let focusDuration = 25 * 60;
        let breakDuration = 5 * 60;
        let sessionCount = 4;
        let currentSession = 0;
        let completedSessions = 0;

        // Audio Variables
        let audioPlayer;
        let isAudioLoaded = false;

        // Initialize the app
        function init() {
            updateClockDisplay();
            generateSessionDots();
            setupEventListeners();
            loadSavedSettings();
        }

        // Set up event listeners
        function setupEventListeners() {
            startBtn.addEventListener('click', startTimer);
            pauseBtn.addEventListener('click', pauseTimer);
            resetBtn.addEventListener('click', resetTimer);
            
            focusTimeInput.addEventListener('change', updateTimerSettings);
            breakTimeInput.addEventListener('change', updateTimerSettings);
            sessionCountInput.addEventListener('change', updateSessionCount);
            
            loadAudioBtn.addEventListener('click', loadAudio);
            volumeSlider.addEventListener('input', updateVolume);
            
            presetButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    const url = btn.getAttribute('data-url');
                    youtubeUrlInput.value = url;
                    presetButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                });
            });
            
            lightsOffBtn.addEventListener('click', toggleLightsOff);
            fullscreenBtn.addEventListener('click', toggleFullscreen);
            
            // Save settings when leaving the page
            window.addEventListener('beforeunload', saveSettings);
            
            // Load default preset
            presetButtons[0].click();
        }

        // Timer Functions
        function startTimer() {
            if (isRunning) return;
            
            isRunning = true;
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            
            // Start the audio if loaded
            if (isAudioLoaded) {
                audioPlayer.playVideo();
            }
            
            timerInterval = setInterval(updateTimer, 1000);
            
            // Show notification
            showNotification(isFocusTime ? 'Focus session started!' : 'Break session started!');
        }

        function pauseTimer() {
            if (!isRunning) return;
            
            isRunning = false;
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            
            // Pause the audio if loaded
            if (isAudioLoaded) {
                audioPlayer.pauseVideo();
            }
            
            clearInterval(timerInterval);
            
            showNotification('Timer paused');
        }

        function resetTimer() {
            isRunning = false;
            isFocusTime = true;
            currentSession = 0;
            completedSessions = 0;
            
            focusDuration = parseInt(focusTimeInput.value) * 60;
            breakDuration = parseInt(breakTimeInput.value) * 60;
            timeLeft = focusDuration;
            
            startBtn.disabled = false;
            pauseBtn.disabled = true;
            
            // Stop the audio if loaded
            if (isAudioLoaded) {
                audioPlayer.stopVideo();
            }
            
            clearInterval(timerInterval);
            updateClockDisplay();
            updateSessionDots();
            
            showNotification('Timer reset');
        }

        function updateTimer() {
            timeLeft--;
            
            if (timeLeft <= 0) {
                // Timer completed
                clearInterval(timerInterval);
                
                if (isFocusTime) {
                    // Focus time completed, start break
                    completedSessions++;
                    isFocusTime = false;
                    timeLeft = breakDuration;
                    
                    // Show notification
                    showNotification('Focus session completed! Time for a break.');
                    
                    // If all sessions completed
                    if (completedSessions >= sessionCount) {
                        showNotification('All pomodoro sessions completed! Great job!');
                        updateSessionDots();
                        return;
                    }
                } else {
                    // Break completed, start focus
                    currentSession++;
                    isFocusTime = true;
                    timeLeft = focusDuration;
                    
                    showNotification('Break completed! Back to focus time.');
                }
                
                updateSessionDots();
                
                // Continue timer automatically
                setTimeout(startTimer, 1000);
                return;
            }
            
            updateClockDisplay();
        }

        function updateClockDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            
            clockElement.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            
            // Update document title
            document.title = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')} - FocusFlow Timer`;
            
            // Change clock color based on mode
            if (isFocusTime) {
                clockElement.style.background = 'linear-gradient(135deg, var(--primary), var(--accent))';
                clockElement.style.webkitBackgroundClip = 'text';
            } else {
                clockElement.style.background = 'linear-gradient(135deg, var(--secondary), #ffcc00)';
                clockElement.style.webkitBackgroundClip = 'text';
            }
        }

        function updateTimerSettings() {
            focusDuration = parseInt(focusTimeInput.value) * 60;
            breakDuration = parseInt(breakTimeInput.value) * 60;
            
            if (!isRunning) {
                timeLeft = isFocusTime ? focusDuration : breakDuration;
                updateClockDisplay();
            }
            
            saveSettings();
        }

        function updateSessionCount() {
            sessionCount = parseInt(sessionCountInput.value);
            generateSessionDots();
            saveSettings();
        }

        function generateSessionDots() {
            sessionDotsContainer.innerHTML = '';
            
            for (let i = 0; i < sessionCount; i++) {
                const dot = document.createElement('div');
                dot.className = 'session-dot';
                
                if (i < completedSessions) {
                    dot.classList.add('completed');
                } else if (i === currentSession) {
                    dot.classList.add('active');
                }
                
                sessionDotsContainer.appendChild(dot);
            }
        }

        function updateSessionDots() {
            const dots = document.querySelectorAll('.session-dot');
            
            dots.forEach((dot, index) => {
                dot.classList.remove('active', 'completed');
                
                if (index < completedSessions) {
                    dot.classList.add('completed');
                } else if (index === currentSession) {
                    dot.classList.add('active');
                }
            });
        }

        // Audio Functions
        function loadAudio() {
            const url = youtubeUrlInput.value.trim();
            
            if (!url) {
                showNotification('Please enter a YouTube URL');
                return;
            }
            
            // Extract video ID from URL
            const videoId = extractYouTubeId(url);
            
            if (!videoId) {
                showNotification('Invalid YouTube URL');
                return;
            }
            
            // Remove existing player if any
            if (audioPlayer) {
                audioPlayer.destroy();
            }
            
            // Create new player
            createAudioPlayer(videoId);
            showNotification('Audio loaded successfully');
        }

        function extractYouTubeId(url) {
            const regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[7].length === 11) ? match[7] : null;
        }

        function createAudioPlayer(videoId) {
            // Load YouTube IFrame API if not already loaded
            if (!window.YT) {
                const tag = document.createElement('script');
                tag.src = 'https://www.youtube.com/iframe_api';
                const firstScriptTag = document.getElementsByTagName('script')[0];
                firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
                
                window.onYouTubeIframeAPIReady = function() {
                    initPlayer(videoId);
                };
            } else {
                initPlayer(videoId);
            }
        }

        function initPlayer(videoId) {
            audioPlayer = new YT.Player('audio-player', {
                height: '0',
                width: '0',
                videoId: videoId,
                playerVars: {
                    autoplay: 0,
                    controls: 0,
                    disablekb: 1,
                    fs: 0,
                    iv_load_policy: 3,
                    modestbranding: 1,
                    playsinline: 1,
                    rel: 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
            
            // Create a hidden div for the player
            let playerContainer = document.getElementById('audio-player');
            if (!playerContainer) {
                playerContainer = document.createElement('div');
                playerContainer.id = 'audio-player';
                playerContainer.style.display = 'none';
                document.body.appendChild(playerContainer);
            }
        }

        function onPlayerReady(event) {
            isAudioLoaded = true;
            event.target.setVolume(parseInt(volumeSlider.value));
            
            // Auto-play if timer is running
            if (isRunning) {
                event.target.playVideo();
            }
        }

        function onPlayerStateChange(event) {
            // If video ends, restart it (for long study music)
            if (event.data === YT.PlayerState.ENDED) {
                event.target.playVideo();
            }
        }

        function updateVolume() {
            if (audioPlayer) {
                audioPlayer.setVolume(parseInt(volumeSlider.value));
            }
            saveSettings();
        }

        // UI Functions
        function toggleLightsOff() {
            document.body.classList.toggle('lights-off');
            const icon = lightsOffBtn.querySelector('i');
            
            if (document.body.classList.contains('lights-off')) {
                icon.className = 'fas fa-lightbulb';
                lightsOffBtn.innerHTML = '<i class="fas fa-lightbulb"></i> Lights On';
                showNotification('Lights off mode activated');
            } else {
                icon.className = 'fas fa-lightbulb';
                lightsOffBtn.innerHTML = '<i class="fas fa-lightbulb"></i> Lights Off';
                showNotification('Lights on mode activated');
            }
            
            saveSettings();
        }

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Error attempting to enable fullscreen: ${err.message}`);
                });
                fullscreenBtn.innerHTML = '<i class="fas fa-compress"></i> Exit Fullscreen';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                    fullscreenBtn.innerHTML = '<i class="fas fa-expand"></i> Fullscreen';
                }
            }
        }

        function showNotification(message) {
            notificationText.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // Save/Load Settings
        function saveSettings() {
            const settings = {
                focusTime: focusTimeInput.value,
                breakTime: breakTimeInput.value,
                sessionCount: sessionCountInput.value,
                volume: volumeSlider.value,
                lightsOff: document.body.classList.contains('lights-off'),
                youtubeUrl: youtubeUrlInput.value
            };
            
            localStorage.setItem('focusflow-settings', JSON.stringify(settings));
        }

        function loadSavedSettings() {
            const saved = localStorage.getItem('focusflow-settings');
            
            if (saved) {
                const settings = JSON.parse(saved);
                
                focusTimeInput.value = settings.focusTime || 25;
                breakTimeInput.value = settings.breakTime || 5;
                sessionCountInput.value = settings.sessionCount || 4;
                volumeSlider.value = settings.volume || 50;
                youtubeUrlInput.value = settings.youtubeUrl || '';
                
                if (settings.lightsOff) {
                    document.body.classList.add('lights-off');
                    lightsOffBtn.innerHTML = '<i class="fas fa-lightbulb"></i> Lights On';
                }
                
                // Update timer variables
                focusDuration = parseInt(focusTimeInput.value) * 60;
                breakDuration = parseInt(breakTimeInput.value) * 60;
                sessionCount = parseInt(sessionCountInput.value);
                timeLeft = focusDuration;
                
                updateClockDisplay();
                generateSessionDots();
            }
        }

        // Initialize the app
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
